name: Update meta data

on:
  workflow_dispatch:
    inputs:
      source_urls:
        description: "Comma-separated PokeDB public JSON URLs. Empty uses the script default."
        required: false
        default: ""
  schedule:
    - cron: "0 20 * * *"

permissions:
  contents: write

concurrency:
  group: update-meta-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Log update trigger
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Update trigger: schedule (daily around 05:00 JST / 20:00 UTC previous day)"
            echo "PokeDB URL input: empty (using script default URLs)"
          else
            echo "Update trigger: workflow_dispatch (manual)"
            echo "PokeDB URL input: ${{ github.event.inputs.source_urls || 'empty (using script default URLs)' }}"
          fi

      - name: Fetch and build meta.json
        id: update_meta
        run: node scripts/update-meta-data.mjs
        env:
          POKEDB_PUBLIC_JSON_URLS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_urls || '' }}

      - name: Commit updated meta.json
        run: |
          if git diff --quiet -- artifacts/pokemon-battle-tool/public/data/meta.json && [ -z "$(git status --porcelain -- artifacts/pokemon-battle-tool/public/data/meta.json)" ]; then
            node -e "console.log('git diff present: false')"
            echo "No meta data changes."
            exit 0
          fi
          node -e "console.log('git diff present: true')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/pokemon-battle-tool/public/data/meta.json
          git commit -m "Update PokeDB meta data"
          git push
