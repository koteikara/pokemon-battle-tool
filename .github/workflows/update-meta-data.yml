name: Update meta data

on:
  workflow_dispatch:
    inputs:
      source_urls:
        description: "Comma-separated PokeDB public JSON URLs. Empty uses the script default."
        required: false
        default: ""
  schedule:
    - cron: "21 18 * * 1"

permissions:
  contents: write

concurrency:
  group: update-meta-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch and build meta.json
        id: update_meta
        continue-on-error: true
        run: node scripts/update-meta-data.mjs
        env:
          POKEDB_PUBLIC_JSON_URLS: ${{ github.event.inputs.source_urls || vars.POKEDB_PUBLIC_JSON_URLS }}
          META_OUTPUT_PATH: artifacts/pokemon-battle-tool/public/data/meta.json

      - name: Keep current data on fetch failure
        if: steps.update_meta.outcome == 'failure'
        run: echo "PokeDB fetch failed, so the existing public/data/meta.json was left unchanged."

      - name: Commit updated meta.json
        if: steps.update_meta.outcome == 'success'
        run: |
          if git diff --quiet -- artifacts/pokemon-battle-tool/public/data/meta.json && [ -z "$(git status --porcelain -- artifacts/pokemon-battle-tool/public/data/meta.json)" ]; then
            echo "No meta data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/pokemon-battle-tool/public/data/meta.json
          git commit -m "Update PokeDB meta data"
          git push
