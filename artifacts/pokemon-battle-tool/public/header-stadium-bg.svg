      <circle cx="635" cy="86" r="8"/><circle cx="725" cy="88" r="7"/><circle cx="810" cy="94" r="6"/>
      <circle cx="890" cy="103" r="6"/><circle cx="980" cy="116" r="7"/><circle cx="1050" cy="130" r="8"/>
