    <pattern id="floorGrid" width="60" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 0H60M0 30H60M0 0V30M60 0V30" fill="none" stroke="#57f7ff" stroke-width="1" opacity="0.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>
  <rect width="1200" height="420" fill="url(#centerGlow)"/>

