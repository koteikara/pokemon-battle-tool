<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="バトルスタジアム風の背景">
  <defs>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#2ff3ff" stop-opacity="0.34"/>
      <stop offset="0.42" stop-color="#3b4ddb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#160926" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22104d"/>
      <stop offset="0.35" stop-color="#17216c"/>
      <stop offset="0.68" stop-color="#0a4d77"/>
      <stop offset="1" stop-color="#4b0c58"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26e7ff" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#172061" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#0b1228"/>
    </linearGradient>
    <filter id="blurGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="crowdDots" width="24" height="18" patternUnits="userSpaceOnUse">
