<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 220" role="img" aria-labelledby="title desc">
  <title id="title">ポケモンバトルツール</title>
  <desc id="desc">赤、黄色、青の縁取りを重ねたオリジナルのゲームロゴ風タイトル画像</desc>
  <defs>
    <linearGradient id="redStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d2f"/>
      <stop offset="0.48" stop-color="#bc0100"/>
      <stop offset="1" stop-color="#6d0000"/>
    </linearGradient>
    <linearGradient id="letterFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8a8"/>
      <stop offset="0.48" stop-color="#fdd400"/>
      <stop offset="0.5" stop-color="#f2a20b"/>
      <stop offset="1" stop-color="#fff3c4"/>
    </linearGradient>
    <linearGradient id="slashFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <filter id="logoShadow" x="-8%" y="-18%" width="116%" height="145%">
      <feDropShadow dx="0" dy="9" stdDeviation="0" flood-color="#111827" flood-opacity="0.92"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#60a5fa" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#logoShadow)">
    <path d="M57 50 H880 L922 86 L894 108 L942 142 L868 177 H80 L34 145 L59 118 L28 88 Z" fill="url(#redStroke)" stroke="#111827" stroke-width="14" stroke-linejoin="round"/>
    <path d="M84 67 H852 L881 90 L841 114 L897 143 L848 163 H105 L73 141 L101 117 L63 91 Z" fill="#1e2a78" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" opacity="0.98"/>
    <path d="M96 80 H835 L854 94 L810 119 L862 141 L830 151 H119 L98 137 L127 115 L88 94 Z" fill="rgba(255,255,255,0.14)"/>
    <path d="M726 20 L760 58 L812 34 L790 82 L846 88 L796 110 L824 160 L772 132 L740 188 L730 126 L668 150 L710 106 L660 72 L718 73 Z" fill="url(#slashFill)" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>
    <text x="490" y="130" text-anchor="middle" dominant-baseline="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="75" font-weight="900" letter-spacing="-3" fill="#111827" stroke="#111827" stroke-width="18" stroke-linejoin="round">ポケモンバトルツール</text>
    <text x="490" y="124" text-anchor="middle" dominant-baseline="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="75" font-weight="900" letter-spacing="-3" fill="url(#letterFill)" stroke="#ffffff" stroke-width="8" stroke-linejoin="round">ポケモンバトルツール</text>
    <text x="490" y="124" text-anchor="middle" dominant-baseline="middle" font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif" font-size="75" font-weight="900" letter-spacing="-3" fill="url(#letterFill)" stroke="#0f3ea8" stroke-width="2" stroke-linejoin="round">ポケモンバトルツール</text>
    <path d="M160 58 H444" stroke="#fff8a8" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
    <path d="M538 160 H805" stroke="#f97316" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
